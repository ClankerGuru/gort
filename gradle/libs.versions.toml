[versions]
kotlin = "2.3.0"
compose-multiplatform = "1.10.0"
agp = "8.7.3"

[libraries]
lucide = { module = "com.composables:icons-lucide-cmp", version = "2.2.1" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
